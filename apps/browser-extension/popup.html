<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simplism</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>Simplism</h1>
    <p id="site">Checking this site…</p>
    <form id="binding">
      <fieldset disabled>
        <label>Application ID <input name="applicationId" required autocomplete="off" spellcheck="false" maxlength="16"></label>
        <label>Runtime key <input name="runtimeKey" required autocomplete="off" spellcheck="false" maxlength="80"></label>
        <label>API origin <input name="apiOrigin" required type="url" autocomplete="off" spellcheck="false" maxlength="200"></label>
        <button type="submit">Save site</button>
      </fieldset>
    </form>
    <section aria-label="Site actions">
      <button id="open" type="button" disabled>Open Simplism</button>
      <button id="toggle" type="button" disabled>Disable on this site</button>
      <button id="refresh" type="button" disabled>Refresh</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
